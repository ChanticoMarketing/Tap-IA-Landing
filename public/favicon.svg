<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
    <defs>
        <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f5d67b" />
            <stop offset="50%" stop-color="#d4af37" />
            <stop offset="100%" stop-color="#aa8a29" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Fondo cuadrado redondeado (18% de radio de esquina) -->
    <rect width="120" height="120" rx="22" ry="22" fill="#0a0b0e" />
    
    <!-- Icono T/A centrado (Desplazamiento horizontal de +20, vertical de +16) -->
    <g transform="translate(20, 16)">
        <path d="M10,80 L40,10 L70,80" stroke="url(#gold-gradient)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" fill="none" filter="url(#glow)" />
        <path d="M25,45 L55,45" stroke="url(#gold-gradient)" stroke-width="8" stroke-linecap="round" />
        
        <!-- Puntos de Datos Azules (Accents) -->
        <circle cx="40" cy="10" r="8" fill="#3b82f6" />
        <circle cx="10" cy="80" r="6" fill="#3b82f6" opacity="0.8" />
        <circle cx="70" cy="80" r="6" fill="#3b82f6" opacity="0.8" />
    </g>
</svg>
